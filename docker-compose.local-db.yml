services:
  db:
    image: timescale/timescaledb:2.21.2-pg17
    container_name: trader-controller-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_locks_per_transaction=2048
      - -c
      - track_io_timing=on
      - -c
      - autovacuum=on
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "127.0.0.1:${CONTROLLER_DB_PORT:-55432}:5432"
    volumes:
      - type: bind
        source: ${LOCAL_PGDATA:?Set LOCAL_PGDATA to the PostgreSQL data directory, for example C:/Users/USER/Desktop/db_data}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    stop_grace_period: 60s
    networks: [controller-net]

  kafka:
    image: apache/kafka:3.7.0
    container_name: trader-kafka
    hostname: trader-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@trader-kafka:9093
      # Host clients use 127.0.0.1:9092, while Docker containers on
      # trader-controller-net use trader-kafka:29092. A single advertised
      # 127.0.0.1 listener breaks container clients because 127.0.0.1 becomes
      # the client container itself.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://trader-kafka:29092,EXTERNAL://127.0.0.1:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-9092}:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [controller-net]

  flyway:
    image: redgate/flyway:11.8.2
    container_name: trader-controller-flyway
    depends_on:
      db:
        condition: service_healthy
    command:
      - -connectRetries=60
      - -baselineOnMigrate=true
      - -baselineVersion=0
      - -validateMigrationNaming=true
      - migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./db/migration:/flyway/sql:ro
    networks: [controller-net]

networks:
  controller-net:
    name: trader-controller-net

volumes:
  kafka-data:
