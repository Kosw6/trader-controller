# Local restored database only. Do not inherit production connection/archiving settings.
listen_addresses = '*'
unix_socket_directories = '/var/run/postgresql'
hba_file = '/etc/postgresql/local-pg_hba.conf'
password_encryption = 'scram-sha-256'
archive_mode = off
archive_command = ''
restore_command = ''
primary_conninfo = ''
timescaledb.telemetry_level = 'off'
timescaledb.max_background_workers = 0
default_transaction_read_only = off
